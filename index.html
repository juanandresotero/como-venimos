<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Cómo venimos?</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="¿Cómo venimos?">
<link rel="preload" href="tipografia/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script>
  /* El tema se aplica ANTES de pintar nada.
     app.js es un modulo, o sea que se ejecuta despues de armar la pagina: si el tema se
     escribiera recien ahi, al abrir en modo oscuro se veria un fogonazo blanco. Son tres
     lineas y evitan justamente eso. */
  try {
    var elegido = localStorage.getItem("como-venimos:tema");
    if (elegido !== "claro" && elegido !== "oscuro") {
      elegido = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
    }
    document.documentElement.setAttribute("data-tema", elegido);
  } catch (e) { /* sin localStorage se usa lo del sistema, que ya hace el CSS */ }
</script>
</head>
<body>

<header class="barra-estado" id="barra-estado" hidden></header>
<div class="barra-guardado" id="barra-guardado" hidden>
  <span id="texto-guardado"></span>
  <button class="boton-mini" id="boton-guardar">Guardar</button>
</div>

<div class="cinta" id="cinta">
  <button class="boton-ajustes" id="boton-tema" aria-label="Cambiar a modo oscuro"
          title="Modo claro u oscuro"></button>
  <button class="boton-ajustes" id="boton-ajustes" aria-label="Ajustes" title="Ajustes">⚙</button>
</div>

<main id="vista" class="vista" tabindex="-1"></main>

<nav class="navegacion" id="navegacion">
  <button class="nav-boton" data-vista="hoy" aria-current="page">
    <span class="nav-icono" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="5" width="17.6" height="15.8" rx="2.6"/><path d="M3.2 9.6h17.6"/><path d="M8 3.2v3.4"/><path d="M16 3.2v3.4"/><circle cx="12" cy="15.3" r="1.7" fill="currentColor" stroke="none"/></svg></span><span class="nav-texto">Hoy</span>
    <span class="nav-globo" id="globo-pendientes" hidden></span>
  </button>
  <button class="nav-boton" data-vista="cartera">
    <span class="nav-icono" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 20.8V11.2h6.4"/><path d="M9 20.8V4.2h9.2v16.6"/><path d="M12.2 8.4h1.2M15.2 8.4h1.2M12.2 12.4h1.2M15.2 12.4h1.2M5.4 15h1.2"/><path d="M1.4 20.8h21.2"/></svg></span><span class="nav-texto">Cartera</span>
  </button>
  <button class="nav-boton" data-vista="negocios">
    <span class="nav-icono" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.8h8.5L19 7.3v13.9H6z"/><path d="M14.5 2.8v4.5H19"/><path d="M8.8 16.4c1.6-2.6 2.6-2.6 3.4 0 .7-2.4 1.8-2.4 3.4-.6"/></svg></span><span class="nav-texto">Negocios</span>
  </button>
  <button class="nav-boton" data-vista="salud">
    <span class="nav-icono" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 12h4.3l2-5.6 3.6 11.2 2.4-5.6h6.9"/></svg></span><span class="nav-texto">Salud</span>
  </button>
  <button class="nav-boton" data-vista="herramientas">
    <span class="nav-icono" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18.9 4.3a4.4 4.4 0 0 0-5.9 5.9L4.4 18.8a1.9 1.9 0 0 0 2.7 2.7l8.6-8.6a4.4 4.4 0 0 0 5.9-5.9l-2.9 2.9-2.6-2.6z"/></svg></span><span class="nav-texto">Herramientas</span>
  </button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
