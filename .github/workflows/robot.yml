name: Robot de cartera

# LA CORRIDA REAL YA NO ES ACA. Desde 2026-11-14 RE/MAX le da 403 a todo lo que no sea un
# navegador comun, y los servidores de GitHub no pasan. La corrida diaria (dos veces por dia,
# 06:00 y 18:00) la hace la PC de Juan con Chrome: ver robot/correr_en_mi_pc.ps1 y
# robot/instalar_tarea_en_mi_pc.ps1. Se sacaron los `cron` de aca a proposito: si siguieran,
# cada corrida de GitHub fallaria y pisaria con un error el estado bueno que deja la PC.
#
# Si RE/MAX algun dia vuelve a dejar pasar a GitHub, se pueden volver a poner:
#   schedule:
#     - cron: "0 9 * * *"      # 06:00 en Uruguay
#     - cron: "0 21 * * *"     # 18:00 en Uruguay
# Lo que queda: la PRUEBA cada vez que se toca el codigo, y la corrida a mano (Actions).
on:
  workflow_dispatch: {}
  push:
    paths:
      - "robot/**"
      - "negocios/**"
      - "herramientas/**"
      - "tests/**"
      - "lib/**"
      - "vistas/**"
      - "tests-js/**"
      - "app.js"
      - ".github/workflows/robot.yml"

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # OJO: aca NO se instala openpyxl a proposito. Es la unica dependencia que no viene
      # con Python, y solo hace falta para importar el Excel a mano. Correr los tests sin
      # ella es la garantia de que ni el robot ni la app la necesitan.
      # SOLO LAS DEL CODIGO. Las que miran los datos de verdad corren en otro job y NO frenan
      # el guardado: un dato raro de Juan no puede dejarlo sin cartera. Paso dos veces —el
      # 2026-09-12 y el 2026-09-24— y la primera fueron cuatro dias sin mirar el portal.
      - name: Correr los tests de Python
        env:
          SIN_DATOS_VIVOS: "1"
        run: python -m unittest discover -s tests -t . -v

  # LAS PRUEBAS QUE MIRAN LOS DATOS DE VERDAD. Corren aparte y NO son requisito para guardar:
  # si algo de los datos no cierra, la corrida queda en rojo y GitHub manda el mail, pero la
  # cartera se guarda igual. Antes eran parte del mismo paso y por eso frenaban todo.
  pruebas-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Revisar los datos de verdad
        run: python -m unittest discover -s tests -t . -v
      # OJO: aca NO se prueba el robot contra RE/MAX en vivo. Desde 2026-11-14 RE/MAX le da 403 a
      # los servidores de GitHub, asi que ese paso siempre fallaba; el robot corre en la PC de Juan
      # (ver robot/correr_en_mi_pc.ps1). Antes estaba en el job `pruebas` y frenaba el guardado.

  # Los 53 tests de JavaScript no corrian en ningun lado salvo la maquina del usuario.
  pruebas-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr los tests de JavaScript
        run: node --test tests-js/*.test.mjs

  grabar:
    # Solo en la corrida diaria o a mano; en los push alcanza con las pruebas.
    if: github.event_name != 'push'
    needs: [pruebas, pruebas-js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Si la API de RE/MAX se cae, el robot igual deja escrito el error en
      # estado_robot.json. Por eso NO se corta la corrida aca: hay que llegar al paso
      # de guardar si o si, para que la app pueda mostrar la alerta roja.
      - name: Bajar la cartera y anotar los cambios
        id: robot
        continue-on-error: true
        run: python -m robot.main

      # Se guarda SIEMPRE, salga bien o mal. Dos motivos:
      #  1. Que la app se entere de que el robot fallo.
      #  2. Que el repositorio tenga actividad todos los dias. GitHub apaga los cron de
      #     los repos que pasan 60 dias sin commits, y estado_robot.json cambia a diario
      #     porque guarda la fecha de la corrida.
      - name: Guardar los datos nuevos
        if: always()
        run: |
          git config user.name "como-venimos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          git commit -m "datos: cartera del $(date -u +%F)" || echo "sin cambios"
          git push

      # Recien ahora se marca la corrida en rojo, para que GitHub mande el mail de aviso.
      - name: Avisar si el robot fallo
        if: steps.robot.outcome == 'failure'
        run: |
          echo "La corrida del robot fallo. El detalle esta en el paso 'Bajar la cartera'."
          exit 1
