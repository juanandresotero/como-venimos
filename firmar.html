<!doctype html>
<!-- Siempre en claro: esto es un documento que se manda a un cliente, no la app.
     Si siguiera el modo oscuro del que lo abre, la carta le llegaria en negro. -->
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oferta de compra</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="app.css">
<!--
  La pagina que abre el cliente desde el enlace de WhatsApp.

  Es una ISLA a proposito: no registra el service worker, no carga la app, no toca la
  cartera ni el token de GitHub. Lee lo que viene despues del `#` —que nunca llega a
  ningun servidor—, muestra la carta, deja completar y firmar, y devuelve.

  El cliente no tiene por que recibir ni un byte del negocio del agente.
-->
</head>
<body>
  <img class="membrete-arriba" src="imagenes/membrete-arriba.jpg" alt="RE/MAX Único">
  <main id="vista" class="vista" style="padding:14px 16px 24px">
    <p class="apunte">Abriendo la carta…</p>
  </main>
  <img class="membrete-abajo" src="imagenes/membrete-abajo.jpg" alt="Av. Brasil 2986 esq. Pedro Berro — www.remax.com.uy — Tel. 2 705 7552">
  <script type="module" src="vistas/firmar.js"></script>
</body>
</html>
